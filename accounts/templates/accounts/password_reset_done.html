{% extends "auth_base.html" %}

{% block title %}Check your email · HRFlow{% endblock %}

{% block content %}
<div class="w-full max-w-sm text-center">
    <div class="card">
        <h1 class="text-headline-md text-on-surface mb-1">Check your email</h1>
        <p class="text-body-sm text-on-surface-variant mb-6">
            If an account exists for that address, we've sent a link to reset the password.
        </p>
        <a href="{% url 'login' %}" class="btn-secondary w-full">Back to sign in</a>
    </div>
</div>
{% endblock %}
